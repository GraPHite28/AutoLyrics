[package]
name = "autolyrics"
version = "0.1.2"
description = "Автоматические синхронизированные тексты песен и визуализатор"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["time"] }
rustfft = "6"
base64 = "0.22"
songrec-lib = "0.5.4"
cpal = "0.17"
regex = "1"
windows = { version = "0.61", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "Win32_System_Com",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
